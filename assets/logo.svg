<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="Ardh logo">
  <title>Ardh — land records, verified</title>
  <style>
    :root { --ink:#0f172a; --sub:#475569; --teal:#14b8a6; --amber:#f59e0b; }
    @media (prefers-color-scheme: dark) { :root { --ink:#f1f5f9; --sub:#94a3b8; } }
    .word { font: 800 76px 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; letter-spacing: 10px; fill: var(--ink); }
    .tag  { font: 500 16px 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; letter-spacing: 3px; fill: var(--sub); }
    .left  { animation: driftL 4s ease-in-out infinite; }
    .right { animation: driftR 4s ease-in-out infinite; }
    .scan  { animation: scan 4s ease-in-out infinite; }
    .tick  { stroke-dasharray: 40; stroke-dashoffset: 40; animation: tick 4s ease-in-out infinite; }
    .dash  { stroke-dasharray: 7 6; animation: march 1.2s linear infinite; }
    .pulse { transform-origin: 100px 100px; animation: pulse 4s ease-out infinite; }
    @keyframes driftL { 0%,15%{transform:translateX(0)} 40%,60%{transform:translateX(-9px)} 85%,100%{transform:translateX(0)} }
    @keyframes driftR { 0%,15%{transform:translateX(0)} 40%,60%{transform:translateX(9px)} 85%,100%{transform:translateX(0)} }
    @keyframes scan   { 0%,10%{transform:translateY(-62px);opacity:0} 20%{opacity:.9} 50%{transform:translateY(62px);opacity:.9} 60%,100%{transform:translateY(62px);opacity:0} }
    @keyframes tick   { 0%,60%{stroke-dashoffset:40;opacity:0} 62%{opacity:1} 75%,92%{stroke-dashoffset:0;opacity:1} 100%{stroke-dashoffset:40;opacity:0} }
    @keyframes march  { to { stroke-dashoffset: -26; } }
    @keyframes pulse  { 0%,60%{transform:scale(.9);opacity:0} 70%{opacity:.5} 100%{transform:scale(1.35);opacity:0} }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .tick{stroke-dashoffset:0} }
  </style>

  <circle class="pulse" cx="100" cy="100" r="70" fill="none" stroke="var(--teal)" stroke-width="3"/>
  <g class="left"><path d="M100 38 L38 100 L100 162 Z" fill="var(--teal)"/></g>
  <g class="right"><path class="dash" d="M100 38 L162 100 L100 162 Z" fill="none" stroke="var(--amber)" stroke-width="5" stroke-linejoin="round"/></g>
  <g class="scan"><rect x="52" y="99" width="96" height="3" rx="1.5" fill="var(--amber)"/></g>
  <path class="tick" d="M80 102 L95 117 L124 84" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <text class="word" x="205" y="112">ARDH</text>
  <text class="tag"  x="209" y="146">LAND RECORDS, VERIFIED</text>
</svg>
